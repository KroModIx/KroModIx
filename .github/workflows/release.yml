name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write # für NuGet-Publish der PluginContracts auf GitHub Packages

# Native Builds pro OS mit Tests, Linux zusätzlich als AppImage.
# Zusätzlicher Publish-Job packt ModManager.PluginContracts als NuGet-Package
# und pusht es auf GitHub Packages — Plugin-Repos referenzieren es via
# PackageReference (siehe references/plugins.md).
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test ModManager.Tests/ModManager.Tests.csproj -c Release

      - name: Publish (win-x64)
        run: >
          dotnet publish ModManager/ModManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o publish/win-x64

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "ModManager-${{ steps.ver.outputs.v }}-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ModManager-*-win-x64.zip
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test ModManager.Tests/ModManager.Tests.csproj -c Release

      - name: Publish (linux-x64)
        run: >
          dotnet publish ModManager/ModManager.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o publish/linux-x64

      - name: Tarball packen
        run: tar -czf "ModManager-${{ steps.ver.outputs.v }}-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: AppImage bauen
        run: bash packaging/linux/build-appimage.sh "${{ steps.ver.outputs.v }}" publish/linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            ModManager-*-linux-x64.tar.gz
            ModManager-*-x86_64.AppImage
          retention-days: 7

  publish-contracts:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: PluginContracts packen
        run: >
          dotnet pack ModManager.PluginContracts/ModManager.PluginContracts.csproj
          -c Release -o dist-nuget

      - name: Auf GitHub Packages pushen
        run: >
          dotnet nuget push "dist-nuget/*.nupkg"
          --source "https://nuget.pkg.github.com/Kroste/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

  release:
    needs: [build-windows, build-linux, publish-contracts]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: GitHub-Release anlegen/aktualisieren
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
